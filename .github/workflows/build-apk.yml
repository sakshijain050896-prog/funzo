name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Funzo.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Funzo-Android-APK
          path: Funzo.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-mobile
          name: Funzo Mobile App v1.0.0
          body: |
            ## 📱 Funzo Mobile Android APK (.apk)
            Download and install `Funzo.apk` directly on any Android smartphone!
            
            ### Installation Instructions:
            1. Download `Funzo.apk` to your phone.
            2. Tap the downloaded file to install.
            3. If Android prompts "Install unknown apps", tap **Settings** and enable **"Allow from this source"**.
            4. Open Funzo and enjoy!
          files: Funzo.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
